[project]
name = "biosignalfoundry"
version = "0.0.1"
description = "An app that helps you achieve financial freedom"
authors = [
    {name = "Jun Siang Pang",email = "junsiang97@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "finnhub-python (>=2.4.26,<3.0.0)",
    "alpha-vantage (>=3.0.0,<4.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "fredapi (>=0.5.2,<0.6.0)",
    "requests (>=2.32.5,<3.0.0)",
    "black (>=25.12.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "massive (>=2.0.2,<3.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "edgartools (>=5.7.1,<6.0.0)",
    "ollama (>=0.6.1,<0.7.0)",
    "langchain-ollama (>=1.0.1,<2.0.0)",
    "langchain (>=1.2.6,<2.0.0)",
    "langchain-deepseek (>=1.0.1,<2.0.0)",
    "deepagents (>=0.4.4,<0.5.0)",
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "structlog (>=25.5.0,<26.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "yfinance (>=0.2.0)",
    "numpy>=2.4.6",
    "pydantic-settings>=2.15.0",
]


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.0.0",
    "httpx>=0.28.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
